# Tools-owned copies of the applications previously hosted by Leads.
# The external dokploy-network is shared with the Tools gateway; only the gateway
# publishes browser routes. Secrets are supplied from the root-only server env file.
services:
  openreply-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${OPENREPLY_POSTGRES_DB:?required}
      POSTGRES_USER: ${OPENREPLY_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${OPENREPLY_POSTGRES_PASSWORD:?required}
    volumes:
      - openreply-db:/var/lib/postgresql/data
    networks:
      dokploy-network:
        aliases: [tools-openreply-db]
    deploy:
      restart_policy:
        condition: on-failure

  openreply-redis:
    image: redis:7-alpine
    volumes:
      - openreply-redis:/data
    networks:
      dokploy-network:
        aliases: [tools-openreply-redis]
    deploy:
      restart_policy:
        condition: on-failure

  openreply-web:
    image: ${OPENREPLY_IMAGE:-complexelite/openreply:0.1.4-ce1}
    environment:
      ALLOWED_EMAILS: ${OPENREPLY_ALLOWED_EMAILS:-}
      AUTH_TRUST_HOST: ${OPENREPLY_AUTH_TRUST_HOST:-true}
      BASE_PATH: ${OPENREPLY_BASE_PATH:-/tools/openreply}
      CRON_SECRET: ${OPENREPLY_CRON_SECRET:?required}
      DATABASE_URL: ${OPENREPLY_DATABASE_URL:?required}
      EMAIL_FROM: ${OPENREPLY_EMAIL_FROM:-OpenReply <login@example.com>}
      EMAIL_SERVER: ${OPENREPLY_EMAIL_SERVER:-}
      ENCRYPTION_KEY: ${OPENREPLY_ENCRYPTION_KEY:?required}
      NEXTAUTH_SECRET: ${OPENREPLY_NEXTAUTH_SECRET:?required}
      NEXTAUTH_URL: ${OPENREPLY_NEXTAUTH_URL:?required}
      AUTH_URL: ${OPENREPLY_AUTH_URL:?required}
      NODE_ENV: production
      REDIS_URL: ${OPENREPLY_REDIS_URL:?required}
      RESEND_API_KEY: ${OPENREPLY_RESEND_API_KEY:-}
    networks:
      dokploy-network:
        aliases: [tools-openreply-web]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  openreply-worker:
    image: ${OPENREPLY_IMAGE:-complexelite/openreply:0.1.4-ce1}
    command: ["npm", "run", "worker"]
    environment:
      ALLOWED_EMAILS: ${OPENREPLY_ALLOWED_EMAILS:-}
      AUTH_TRUST_HOST: ${OPENREPLY_AUTH_TRUST_HOST:-true}
      BASE_PATH: ${OPENREPLY_BASE_PATH:-/tools/openreply}
      CRON_SECRET: ${OPENREPLY_CRON_SECRET:?required}
      DATABASE_URL: ${OPENREPLY_DATABASE_URL:?required}
      EMAIL_FROM: ${OPENREPLY_EMAIL_FROM:-OpenReply <login@example.com>}
      EMAIL_SERVER: ${OPENREPLY_EMAIL_SERVER:-}
      ENCRYPTION_KEY: ${OPENREPLY_ENCRYPTION_KEY:?required}
      NEXTAUTH_SECRET: ${OPENREPLY_NEXTAUTH_SECRET:?required}
      NEXTAUTH_URL: ${OPENREPLY_NEXTAUTH_URL:?required}
      AUTH_URL: ${OPENREPLY_AUTH_URL:?required}
      NODE_ENV: production
      REDIS_URL: ${OPENREPLY_REDIS_URL:?required}
      RESEND_API_KEY: ${OPENREPLY_RESEND_API_KEY:-}
    networks: [dokploy-network]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  openreply-cron:
    image: ${OPENREPLY_IMAGE:-complexelite/openreply:0.1.4-ce1}
    command: ["sh", "scripts/cron.sh"]
    environment:
      CRON_BASE_URL: http://tools-openreply-web:3000/tools/openreply
      CRON_SECRET: ${OPENREPLY_CRON_SECRET:?required}
      NEXTAUTH_SECRET: ${OPENREPLY_NEXTAUTH_SECRET:?required}
    networks: [dokploy-network]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  google-maps-scraper:
    image: complexelite/google-maps-scraper:ce-509813c
    command: ["-data-folder", "/gmapsdata"]
    environment:
      GOOGLE_MAPS_BASE_URL: https://tools.complexelite.com/google-maps-scraper
    volumes:
      - maps-data:/gmapsdata
    networks:
      dokploy-network:
        aliases: [tools-google-maps-scraper]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  scrapling:
    image: ghcr.io/d4vinci/scrapling:latest
    command: ["mcp", "--http", "--host", "0.0.0.0", "--port", "8000", "--allowed-host", "tools.complexelite.com"]
    environment:
      SCRAPLING_MCP_AUTH_TOKEN: ${SCRAPLING_MCP_AUTH_TOKEN:?required}
    networks:
      dokploy-network:
        aliases: [tools-scrapling]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres@sha256:d719b36160eac2fcbe16dc7e7360ddb9c82c40ea5da183d07bf4a755c6a0b2ae
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: postgres
    volumes:
      - firecrawl-postgres:/var/lib/postgresql/data
    networks:
      firecrawl-private:
        aliases: [firecrawl-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
      restart_policy:
        condition: on-failure

  firecrawl-redis:
    image: redis:7-alpine
    command: ["redis-server", "--bind", "0.0.0.0", "--appendonly", "yes"]
    volumes:
      - firecrawl-redis:/data
    networks:
      firecrawl-private:
        aliases: [firecrawl-redis]
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.15"
          memory: 256M
      restart_policy:
        condition: on-failure

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    hostname: firecrawl-rabbitmq
    environment:
      RABBITMQ_NODENAME: rabbit@firecrawl-rabbitmq
    secrets:
      - source: firecrawl-erlang-cookie-v1
        target: /var/lib/rabbitmq/.erlang.cookie
        uid: "999"
        gid: "999"
        mode: 0400
    networks:
      firecrawl-private:
        aliases: [firecrawl-rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.15"
          memory: 512M
      restart_policy:
        condition: on-failure

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service@sha256:227ce3d8059173925a5a0697c63a1e947662cca934a609151651f578774edd5d
    environment:
      PORT: "3000"
      MAX_CONCURRENT_PAGES: "1"
    networks:
      firecrawl-private:
        aliases: [firecrawl-playwright]
      firecrawl-egress: {}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=768m
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.25"
          memory: 2560M
      restart_policy:
        condition: on-failure

  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl@sha256:1b223ef18d410f67615f32ccaa3dcedfc26af4286f096247bddca3b624545e63
    command: ["node", "dist/src/harness.js", "--start-docker"]
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"
      ENV: local
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: postgres
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: "5432"
      USE_DB_AUTHENTICATION: "false"
      NUM_WORKERS_PER_QUEUE: "1"
      CRAWL_CONCURRENT_REQUESTS: "1"
      MAX_CONCURRENT_JOBS: "1"
      BROWSER_POOL_SIZE: "1"
      HARNESS_STARTUP_TIMEOUT_MS: "60000"
    networks:
      firecrawl-private: {}
      firecrawl-egress: {}
      dokploy-network:
        aliases: [tools-firecrawl-api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/v0/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.75"
          memory: 3G
      restart_policy:
        condition: on-failure

networks:
  dokploy-network:
    external: true
  firecrawl-private:
    driver: overlay
    internal: true
  firecrawl-egress:
    driver: overlay

secrets:
  firecrawl-erlang-cookie-v1:
    external: true

volumes:
  openreply-db:
    name: tools_openreply-db
  openreply-redis:
    name: tools_openreply-redis
  maps-data:
    name: tools_maps-data
  firecrawl-postgres:
    name: tools_firecrawl-postgres
  firecrawl-redis:
    name: tools_firecrawl-redis
